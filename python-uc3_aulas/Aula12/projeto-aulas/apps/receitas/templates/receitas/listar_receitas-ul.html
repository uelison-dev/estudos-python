{# templates/receitas/lista.html #}
{% extends "_base.html" %}

{% block title %}
  Receitas
{% endblock %}

{% block content %}
  <div class="container my-5">

    <h1 class="mb-4">Receitas</h1>

    <ul>
    {% for receita in receitas  %}
      <li> {{ receita.titulo }} - 
        <a href="{# % url 'receitas:detalhe_receita' receita.pk % #}"> Exibir </a>
      </li>
    {% empty %}
      <li> Não há receitas cadastradas </li>
    {% endfor %}
    </ul>

  </div>
{% endblock %}
