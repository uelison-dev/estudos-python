<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Estrutura HTML5 com Bootstrap e Font Awesome</title>
    <meta name="description" content="Uma página de exemplo para demonstrar a estrutura básica do HTML5 com Bootstrap e Font Awesome.">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <!-- Estilos personalizados (opcional) -->
    <style>
        body {
            padding: 20px;
        }
    </style>
</head>
<body>

    <section>
        <h1>Exemplo de uso de imagem</h1>
        <h4>1º Imagem</h4>
        <figure>
            <img src="img/paisagem.jpg" alt="Por do Sol - Praia Grande - Arraial do Cabo"
                width="300px"
                title="Por do Sol - Praia Grande - Arraial do Cabo">
                <figcaption> Figura 1: Praia Grande - Arraial do Cabo</figcaption>
        </figure>
        <hr>
    </section>

    <section>
        <h4>2º imagem</h4>
        <figure>
            <img src="img/bird-8450958_1920.png" alt="Aqui tem uma paisagem"
                width="300px"
                title="Praia Grande - Arraial do Cabo">
                <figcaption> Figura 2: Imagem de uma ave</figcaption>
        </figure>
        <hr>
    </section>

    <section>
        <h4>3º imagem</h4>
        <figure>
            <img src="img/background-7842730_1920.jpg" alt="Aqui tem uma paisagem"
                width="300px"
                title="Imagem em Pixelart">
                <figcaption> Figura 3: Paisagem em pixelart</figcaption>
        </figure>
        <hr>
    </section>

    <section>
        <h4>4º imagem</h4>
        <figure>
            <img src="img/banner-seguranca-001.png" alt="Banner de segurança"
                width="300px"
                title="Banner de segurança">
                <figcaption> Figura 4: Banner de segurança</figcaption>
        </figure>
        <hr>
    </section>

    <section>
        <h4>5º imagem</h4>
        <figure>
            <img src="img/bouquet-8627534_1920.jpg" alt="Bouquet de flores"
                width="300px"
                title="Bouquet de flores">
                <figcaption> Figura 5: Bouquet de flores</figcaption>
        </figure>
        <hr>
    </section>

    <section>
        <h4>6º imagem</h4>
        <figure>
            <img src="img/christmas-6805045_1920.jpg" alt="Presente de natal"
                width="300px"
                title="Presente de natal">
                <figcaption> Figura 6: Presente de natal</figcaption>
        </figure>
        <hr>
    </section>

    

    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
